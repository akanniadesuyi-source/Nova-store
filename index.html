
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Store</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0d12;
  color: #f5f5f5;
}
header {
  padding: 22px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252832;
}
.logo { font-size: 23px; font-weight: bold; }
.logo span { color: #8b7cff; }
button {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 12px 16px;
  font-weight: bold;
}
.cart-btn, .primary {
  background: #8b7cff;
  color: white;
}
main { max-width: 1050px; margin: auto; padding: 35px 18px; }
.hero { padding: 25px 0 35px; }
.hero h1 { font-size: clamp(32px, 7vw, 54px); margin: 0 0 12px; }
.hero p, .muted { color: #a6a9b5; line-height: 1.6; }
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}
.card {
  background: #151821;
  border: 1px solid #292d39;
  border-radius: 15px;
  padding: 18px;
}
.art {
  height: 120px;
  display: grid;
  place-items: center;
  background: #222037;
  border-radius: 10px;
  font-size: 42px;
}
.card h3 { margin-bottom: 6px; }
.price { font-size: 21px; font-weight: bold; margin: 15px 0; }
.card button { width: 100%; }
section.cart {
  margin-top: 35px;
  padding: 22px;
  border-radius: 15px;
  background: #151821;
  border: 1px solid #292d39;
}
.cart-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #292d39;
}
.qty { display: flex; align-items: center; gap: 10px; }
.qty button { padding: 7px 11px; }
.total { font-size: 22px; font-weight: bold; margin: 20px 0; }
.primary { width: 100%; }
.notice { font-size: 12px; color: #a6a9b5; margin-top: 12px; }
footer { text-align: center; padding: 30px; color: #888d9b; }
</style>
</head>
<body>

<header>
  <div class="logo">NOVA<span>STORE</span></div>
  <button class="cart-btn" onclick="showCart()">
    Cart (<span id="count">0</span>)
  </button>
</header>

<main>
  <div class="hero">
    <p>WELCOME TO NOVA STORE</p>
    <h1>Digital products.<br>Made simple.</h1>
    <p>Discover useful digital resources in one place.</p>
  </div>

  <h2>Featured products</h2>
  <div class="products" id="products"></div>

  <section class="cart" id="cart">
    <h2>Your shopping cart</h2>
    <div id="cart-items"></div>
    <div class="total">Total: <span id="total">₦0</span></div>
    <button class="primary" onclick="checkout()">Continue to checkout</button>
    <p class="notice">
      Demo only. No real payment is collected or processed.
    </p>
  </section>
</main>

<footer>© 2026 Nova Store · Demo project</footer>

<script>
const products = [
  { id: 1, name: "Website Template", price: 2500, icon: "🌐" },
  { id: 2, name: "Social Media Design Pack", price: 1500, icon: "🎨" },
  { id: 3, name: "Creator Planner", price: 1000, icon: "📒" }
];

let cart = [];

const money = amount =>
  "₦" + amount.toLocaleString("en-NG");

function renderProducts() {
  document.getElementById("products").innerHTML =
    products.map(p => `
      <article class="card">
        <div class="art">${p.icon}</div>
        <h3>${p.name}</h3>
        <p class="muted">Digital product · Demo item</p>
        <div class="price">${money(p.price)}</div>
        <button class="primary" onclick="addToCart(${p.id})">
          Add to cart
        </button>
      </article>
    `).join("");
}

function addToCart(id) {
  const item = cart.find(p => p.id === id);

  if (item) {
    item.qty++;
  } else {
    const product = products.find(p => p.id === id);
    cart.push({ ...product, qty: 1 });
  }

  renderCart();
}

function changeQty(id, amount) {
  const item = cart.find(p => p.id === id);
  if (!item) return;

  item.qty += amount;
  cart = cart.filter(p => p.qty > 0);
  renderCart();
}

function renderCart() {
  const count = cart.reduce((sum, p) => sum + p.qty, 0);
  const total = cart.reduce((sum, p) => sum + p.price * p.qty, 0);

  document.getElementById("count").textContent = count;
  document.getElementById("total").textContent = money(total);

  document.getElementById("cart-items").innerHTML =
    cart.length ? cart.map(p => `
      <div class="cart-row">
        <div>
          <strong>${p.name}</strong><br>
          <span class="muted">${money(p.price)} each</span>
        </div>
        <div class="qty">
          <button onclick="changeQty(${p.id}, -1)">−</button>
          <span>${p.qty}</span>
          <button onclick="changeQty(${p.id}, 1)">+</button>
        </div>
      </div>
    `).join("") : '<p class="muted">Your cart is empty.</p>';
}

function showCart() {
  document.getElementById("cart").scrollIntoView({
    behavior: "smooth"
  });
}

function checkout() {
  if (cart.length === 0) {
    alert("Your cart is empty. Add a product first.");
    return;
  }

  const summary = cart.map(p =>
    `${p.name} x ${p.qty} = ${money(p.price * p.qty)}`
  ).join("\n");

  const total = cart.reduce(
    (sum, p) => sum + p.price * p.qty, 0
  );

  alert(
    "DEMO CHECKOUT\n\n" + summary +
    "\n\nTotal: " + money(total) +
    "\n\nNo payment has been taken."
  );
}

renderProducts();
renderCart();
</script>
</body>
      </html>
